<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Stock Ticker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="card">
    <!-- 드래그 가능한 헤더 영역 -->
    <div class="drag-bar">
      <span class="grip">⠿</span>
      <div class="bar-btns">
        <button id="stopBtn" class="icon-btn no-drag hidden" title="설정">⚙</button>
        <button id="closeBtn" class="icon-btn no-drag" title="종료">✕</button>
      </div>
    </div>

    <!-- 설정 패널 -->
    <div id="settings" class="settings">
      <div class="search-wrap">
        <input id="searchInput" class="no-drag" type="text" autocomplete="off"
               placeholder="종목명·코드 검색 (예: 삼성, AAPL, 005930)" />
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <div id="watchlist" class="watchlist"></div>
      <select id="themeSelect" class="no-drag">
        <option value="minimal">테마: 미니멀</option>
        <option value="terminal">테마: 터미널/로그</option>
        <option value="build">테마: 빌드 진행률</option>
        <option value="sheet">테마: 스프레드시트</option>
        <option value="chat">테마: 채팅/메신저</option>
      </select>
      <div class="row">
        <select id="intervalSelect" class="no-drag">
          <option value="30">30초</option>
          <option value="60">1분</option>
        </select>
        <button id="startBtn" class="no-drag primary">시작</button>
      </div>
      <div class="checks">
        <label class="no-drag"><input id="hideName" type="checkbox" /> 종목명 숨기기</label>
        <label class="no-drag"><input id="hideCode" type="checkbox" /> 종목코드 숨기기</label>
        <label class="no-drag"><input id="bizMode" type="checkbox" /> 비즈니스 모드 (업무용 워딩)</label>
      </div>
      <div class="checks">
        <label class="no-drag"><input id="petMode" type="checkbox" /> 캐릭터 모드 (바탕화면에 띄우기)</label>
        <label class="no-drag"><input id="petWander" type="checkbox" /> └ 알아서 돌아다니기</label>
        <label class="no-drag"><input id="shareSymbol" type="checkbox" /> └ 친구에게 종목명도 공개</label>
      </div>

      <!-- 친구 연결: 초대 코드 하나로 접속 정보와 방이 전달된다 -->
      <div id="friendBox" class="friend-box hidden">
        <div class="row">
          <input id="petName" class="no-drag" type="text" maxlength="10" placeholder="내 이름" />
          <button id="netBtn" class="no-drag">연결</button>
        </div>
        <div class="row">
          <input id="inviteCode" class="no-drag" type="password" autocomplete="off"
                 placeholder="초대 코드 붙여넣기" />
          <button id="copyInvite" class="no-drag" title="초대 코드 복사">복사</button>
        </div>
        <div class="friend-foot">
          <span id="netState" class="net-state">연결 안 됨</span>
          <button id="makeInvite" class="no-drag link-btn">코드 만들기</button>
        </div>

        <!-- 방을 여는 사람만 쓴다. 평소에는 접혀 있다.
             Electron 은 window.prompt() 를 지원하지 않아 패널에 직접 받는다. -->
        <div id="inviteForm" class="invite-form hidden">
          <input id="sbUrl" class="no-drag" type="text" autocomplete="off"
                 placeholder="API URL — Settings → Data API" />
          <input id="sbKey" class="no-drag" type="password" autocomplete="off"
                 placeholder="Publishable key — Settings → API Keys" />
          <div class="friend-foot">
            <span id="inviteMsg" class="net-state"></span>
            <button id="inviteGen" class="no-drag">코드 생성</button>
          </div>
        </div>
      </div>
      <div class="alert-row">
        <label class="no-drag"><input id="surgeOn" type="checkbox" /> 급등락 알림 ±</label>
        <input id="surgePct" class="no-drag" type="text" inputmode="decimal" value="5" maxlength="4" />
        <span class="alert-unit">%</span>
        <label class="no-drag alert-os"><input id="osNotify" type="checkbox" checked /> OS알림</label>
      </div>
      <div class="opacity-row">
        <label>투명도</label>
        <input id="opacitySlider" class="no-drag" type="range" min="10" max="100" value="78" />
        <span id="opacityVal">78%</span>
      </div>
    </div>

    <!-- 시세 표시 패널: 선택한 테마가 이 안을 채운다 -->
    <div id="ticker" class="ticker hidden">
      <div id="tickerBody"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
